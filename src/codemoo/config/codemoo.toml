language = "English"

[paths]
bots_dir = "{project_path}/src/codemoo/core/bots"
m365_token_path = "{cache_path}/token_cache.bin"
workspace_token_path = "{cache_path}/workspace_token.pkl"

#
# Scripts
#
[scripts.all]
bots = [
    { type = "EchoBot", variant = "default" },
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "SystemBot", variant = "default" },
    { type = "ToolBot", variant = "default" },
    { type = "ReadBot", variant = "code" },
    { type = "ChangeBot", variant = "code" },
    { type = "AgentBot", variant = "code" },
    { type = "GuardBot", variant = "code" },
    { type = "ProjectBot", variant = "code" },
    { type = "MemoryBot", variant = "code" },
    { type = "RetryBot", variant = "code" },
    { type = "CompactBot", variant = "code" },
]

[scripts.code]
bots = [
    { type = "EchoBot", variant = "default" },
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "SystemBot", variant = "default" },
    { type = "ToolBot", variant = "default" },
    { type = "ReadBot", variant = "code" },
    { type = "ChangeBot", variant = "code" },
    { type = "AgentBot", variant = "code" },
    { type = "GuardBot", variant = "code" },
    { type = "ProjectBot", variant = "code" },
]

[scripts.focused]
bots = [
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "AgentBot", variant = "code" },
    { type = "GuardBot", variant = "code" },
]

[scripts.m365]
bots = [
    { type = "EchoBot", variant = "default" },
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "SystemBot", variant = "default" },
    { type = "ToolBot", variant = "default" },
    { type = "ScanBot", variant = "m365" },
    { type = "SendBot", variant = "m365" },
    { type = "AgentBot", variant = "m365" },
    { type = "GuardBot", variant = "m365" },
    { type = "ProjectBot", variant = "m365" },
    { type = "MemoryBot", variant = "m365" },
    { type = "RetryBot", variant = "m365" },
    { type = "CompactBot", variant = "m365" },
]

[scripts.workspace]
bots = [
    { type = "EchoBot", variant = "default" },
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "SystemBot", variant = "default" },
    { type = "ToolBot", variant = "default" },
    { type = "ScanBot", variant = "workspace" },
    { type = "SendBot", variant = "workspace" },
    { type = "AgentBot", variant = "workspace" },
    { type = "GuardBot", variant = "workspace" },
    { type = "ProjectBot", variant = "workspace" },
    { type = "MemoryBot", variant = "workspace" },
    { type = "RetryBot", variant = "workspace" },
    { type = "CompactBot", variant = "workspace" },
]

[scripts.vs]
bots = [
    { type = "EchoBot", variant = "default" },
    { type = "LlmBot", variant = "default" },
    { type = "ChatBot", variant = "default" },
    { type = "SystemBot", variant = "default" },
    { type = "ToolBot", variant = "default" },
    { type = "ScanBot", variant = "workspace" },
    { type = "ReadBot", variant = "code" },
    { type = "ChangeBot", variant = "code" },
    { type = "SendBot", variant = "workspace" },
    { type = "AgentBot", variant = "code" },
    { type = "GuardBot", variant = "code" },
]

#
# Named tool lists — reference with @name inside a variant's tools array
#
[tool_lists]
code_read = ["read_file", "list_files"]
code_write = ["write_file", "run_shell"]
m365_read = [
    "get_datetime",
    "read_sharepoint",
    "list_sharepoint",
    "read_outlook_email",
    "list_outlook_email",
    "list_outlook_calendar",
]
m365_write = [
    "draft_outlook_email",
    "list_outlook_drafts",
    "send_outlook_email",
    "create_outlook_calendar_event",
    "post_teams_message",
    "write_sharepoint",
]
workspace_read = [
    "get_datetime",
    "read_gmail",
    "list_gmail",
    "list_gcal",
    "list_gdrive",
    "read_gdrive"
]
workspace_write = [
    "draft_gmail",
    "list_gmail_drafts",
    "send_gmail",
    "create_gcal_event",
    "post_chat_message",
    "write_gdrive",
]

#
# Bots — coding path
#
[bots.EchoBot]
name = "Coco"
emoji = "PARROT"
sources = ["echo_bot.py"]

[bots.EchoBot.variants.default]
description = "Repeat your message verbatim — no LLM, just a mirror."
prompts_file = "echo_bot-default.txt"

[bots.LlmBot]
name = "Mono"
emoji = "SPARKLES"
sources = ["llm_bot.py"]

[bots.LlmBot.variants.default]
description = "Call the LLM once and forget the conversation immediately after."
prompts_file = "llm_bot-default.txt"
capabilities = ["context_display", "tracing"]

[bots.ChatBot]
name = "Iris"
emoji = "NAZAR AMULET"
sources = ["chat_bot.py"]

[bots.ChatBot.variants.default]
description = "Keep the full conversation history, remember what you said."
prompts_file = "chat_bot-default.txt"
capabilities = ["context_display", "tracing"]

[bots.SystemBot]
name = "Sona"
emoji = "PERFORMING ARTS"
sources = ["system_bot.py"]

[bots.SystemBot.variants.default]
description = "Add a system prompt to shape the LLM's persona and behavior."
instruction_file = "system_bot-default.txt"
prompts_file = "system_bot-default.txt"
capabilities = ["context_display", "tracing"]

[bots.ToolBot]
name = "Telo"
emoji = "WRENCH"
sources = ["tool_bot.py", "single_turn_tool_bot.py"]

[bots.ToolBot.variants.default]
description = "Call a tool before replying — the first step toward doing things."
instruction_file = "tool_bot-default.txt"
tools = ["reverse_string"]
prompts_file = "tool_bot-default.txt"
capabilities = ["context_display", "tracing"]

[bots.ReadBot]
name = "Rune"
emoji = "FILE FOLDER"
sources = ["read_bot.py", "single_turn_tool_bot.py"]

[bots.ReadBot.variants.code]
description = "Read files from disk to answer questions about your code."
instruction_file = "read_bot-code.txt"
tools = ["@code_read"]
prompts_file = "read_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.ScanBot]
name = "Roam"
emoji = "PEDESTRIAN"
sources = ["scan_bot.py", "single_turn_tool_bot.py"]

[bots.ScanBot.variants.m365]
description = "Read SharePoint docs, email, and calendar — observational M365 access."
instruction_file = "scan_bot-m365.txt"
tools = ["@m365_read"]
prompts_file = "scan_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.ScanBot.variants.workspace]
description = "Read Gmail, Google Calendar, and Google Drive — observational Workspace access."
instruction_file = "scan_bot-workspace.txt"
tools = ["@workspace_read"]
prompts_file = "scan_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.ChangeBot]
name = "Axel"
emoji = "HAMMER"
sources = ["change_bot.py", "single_turn_tool_bot.py"]

[bots.ChangeBot.variants.code]
description = "Execute shell commands and write files — now it can change things."
instruction_file = "change_bot-code.txt"
tools = ["@code_read", "@code_write"]
prompts_file = "change_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.SendBot]
name = "Aero"
emoji = "OUTBOX TRAY"
sources = ["send_bot.py", "single_turn_tool_bot.py"]

[bots.SendBot.variants.m365]
description = "Send email, create calendar events, post to Teams, write SharePoint docs."
instruction_file = "send_bot-m365.txt"
tools = ["@m365_read", "@m365_write"]
prompts_file = "send_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.SendBot.variants.workspace]
description = "Send Gmail, create Google Calendar events, post to Google Chat, write Google Drive files."
instruction_file = "send_bot-workspace.txt"
tools = ["@workspace_read", "@workspace_write"]
prompts_file = "send_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.AgentBot]
name = "Loom"
emoji = "CYCLONE"
sources = ["agent_bot.py"]

[bots.AgentBot.variants.code]
description = "Loop tool calls until done — pursue goals, not single commands."
instruction_file = "agent_bot-code.txt"
tools = ["@code_read", "@code_write"]
prompts_file = "agent_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.AgentBot.variants.m365]
description = "Loop M365 tool calls until done — pursue goals across email, calendar, and SharePoint."
instruction_file = "agent_bot-m365.txt"
tools = ["@m365_read", "@m365_write"]
prompts_file = "agent_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.AgentBot.variants.workspace]
description = "Loop Google Workspace tool calls until done — pursue goals across Gmail, Calendar, and Drive."
instruction_file = "agent_bot-workspace.txt"
tools = ["@workspace_read", "@workspace_write"]
prompts_file = "agent_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.GuardBot]
name = "Cato"
emoji = "LOCK"
sources = ["guard_bot.py"]

[bots.GuardBot.variants.code]
description = "Pause before dangerous tool calls — nothing destructive without your say-so."
instruction_file = "guard_bot-code.txt"
tools = ["@code_read", "@code_write"]
prompts_file = "guard_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.GuardBot.variants.m365]
description = "Pause before sending M365 actions — nothing sent without your say-so."
instruction_file = "guard_bot-m365.txt"
tools = ["@m365_read", "@m365_write"]
prompts_file = "guard_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.GuardBot.variants.workspace]
description = "Pause before sending Workspace actions — nothing sent without your say-so."
instruction_file = "guard_bot-workspace.txt"
tools = ["@workspace_read", "@workspace_write"]
prompts_file = "guard_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.ProjectBot]
name = "Lore"
emoji = "OPEN BOOK"
sources = ["project_bot.py"]

[bots.ProjectBot.variants.code]
description = "Read AGENTS.md for project context before acting."
instruction_file = "project_bot-code.txt"
context_source = { type = "file", name = "AGENTS.md" }
tools = ["@code_read", "@code_write"]
prompts_file = "project_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.ProjectBot.variants.m365]
description = "Read team context from SharePoint before acting."
instruction_file = "project_bot-m365.txt"
context_source = { type = "sharepoint", name = "TEAM.md" }
tools = ["@m365_read", "@m365_write"]
prompts_file = "project_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.ProjectBot.variants.workspace]
description = "Read team context from Google Drive before acting."
instruction_file = "project_bot-workspace.txt"
context_source = { type = "drive", name = "TEAM.md" }
tools = ["@workspace_read", "@workspace_write"]
prompts_file = "project_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.MemoryBot]
name = "Aura"
emoji = "SMILING FACE WITH HALO"
sources = ["memory_bot.py"]

[bots.MemoryBot.variants.code]
description = "Persist facts and preferences across sessions via a local memory file."
instruction_file = "memory_bot-code.txt"
context_source = { type = "file", name = "AGENTS.md" }
memory_file = "{project_settings_path}/memory-code.md"
tools = ["@code_read", "@code_write", "save_memory"]
prompts_file = "memory_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.MemoryBot.variants.m365]
description = "Persist user preferences across sessions via a local memory file."
instruction_file = "memory_bot-m365.txt"
context_source = { type = "sharepoint", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-m365.md"
tools = ["@m365_read", "@m365_write", "save_memory"]
prompts_file = "memory_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.MemoryBot.variants.workspace]
description = "Persist user preferences across sessions via a local memory file."
instruction_file = "memory_bot-workspace.txt"
context_source = { type = "drive", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-workspace.md"
tools = ["@workspace_read", "@workspace_write", "save_memory"]
prompts_file = "memory_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.RetryBot]
name = "Undo"
emoji = "GAME DIE"
sources = ["retry_bot.py"]

[bots.RetryBot.variants.code]
description = "Retry failing tool calls up to 3 times, then escalate with a clear summary."
instruction_file = "retry_bot-code.txt"
context_source = { type = "file", name = "AGENTS.md" }
memory_file = "{project_settings_path}/memory-code.md"
tools = ["@code_read", "@code_write", "save_memory"]
prompts_file = "retry_bot-code.txt"
capabilities = ["context_display", "tracing"]

[bots.RetryBot.variants.m365]
description = "Retry failing M365 tool calls up to 3 times, then escalate with a clear summary."
instruction_file = "retry_bot-m365.txt"
context_source = { type = "sharepoint", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-m365.md"
tools = ["@m365_read", "@m365_write", "save_memory"]
prompts_file = "retry_bot-m365.txt"
capabilities = ["context_display", "tracing"]

[bots.RetryBot.variants.workspace]
description = "Retry failing Workspace tool calls up to 3 times, then escalate with a clear summary."
instruction_file = "retry_bot-workspace.txt"
context_source = { type = "drive", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-workspace.md"
tools = ["@workspace_read", "@workspace_write", "save_memory"]
prompts_file = "retry_bot-workspace.txt"
capabilities = ["context_display", "tracing"]

[bots.CompactBot]
name = "Drop"
emoji = "BROOM"
sources = ["compact_bot.py"]

[bots.CompactBot.variants.code]
description = "Summarise old context automatically when the token budget is exceeded."
instruction_file = "compact_bot-code.txt"
context_source = { type = "file", name = "AGENTS.md" }
memory_file = "{project_settings_path}/memory-code.md"
tools = ["@code_read", "@code_write", "save_memory"]
prompts_file = "compact_bot-code.txt"
capabilities = ["context_display", "tracing"]
compact_threshold = 8000

[bots.CompactBot.variants.m365]
description = "Summarise old context automatically when the token budget is exceeded."
instruction_file = "compact_bot-m365.txt"
context_source = { type = "sharepoint", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-m365.md"
tools = ["@m365_read", "@m365_write", "save_memory"]
prompts_file = "compact_bot-m365.txt"
capabilities = ["context_display", "tracing"]
compact_threshold = 8000

[bots.CompactBot.variants.workspace]
description = "Summarise old context automatically when the token budget is exceeded."
instruction_file = "compact_bot-workspace.txt"
context_source = { type = "drive", name = "TEAM.md" }
memory_file = "{user_settings_path}/memory-workspace.md"
tools = ["@workspace_read", "@workspace_write", "save_memory"]
prompts_file = "compact_bot-workspace.txt"
capabilities = ["context_display", "tracing"]
compact_threshold = 8000

[bots.CompactBot.variants.codemoo]
description = "Full-capability coding assistant with automatic context summarisation."
instruction_file = "compact_bot-codemoo.txt"
context_source = { type = "file", name = "AGENTS.md" }
memory_file = "{project_settings_path}/memory-code.md"
tools = ["@code_read", "@code_write", "save_memory"]
capabilities = ["context_display", "tracing"]
compact_threshold = 100_000

