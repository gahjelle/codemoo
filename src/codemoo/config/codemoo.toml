#
# Microsoft 365 / Graph API, see README for set up
#
[m365]
tenant_id = "00000000-0000-0000-0000-000000000000"
client_id = "00000000-0000-0000-0000-000000000000"
sharepoint_host = "contoso.sharepoint.com"
sharepoint_site = "/sites/demo"
graph_base_url = "https://graph.microsoft.com/v1.0"
scopes = ["https://graph.microsoft.com/.default"]

#
# Google Workspace / OAuth, see README for set up
#
[workspace]
client_id = "000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com"
client_secret = "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"
scopes = [
    "https://www.googleapis.com/auth/gmail.readonly",
    "https://www.googleapis.com/auth/gmail.compose",
    "https://www.googleapis.com/auth/gmail.send",
    "https://www.googleapis.com/auth/calendar.readonly",
    "https://www.googleapis.com/auth/calendar.events",
    "https://www.googleapis.com/auth/drive",
]

#
# Model backends
#
[models]
# Empty string = use fallback list. Set CODEMOO_BACKEND to force a specific backend (no fallback).
backend = ""
fallbacks = ["mistral", "openrouter", "google", "anthropic", "openai", "ollama"]

[models.backends.mistral]
model_name = "mistral-small-latest"

[models.backends.ollama]
model_name = "qwen2.5-coder:7b"
base_url = "http://localhost:11434/v1"

[models.backends.openrouter]
model_name = "z-ai/glm-4.5-air:free"
base_url = "https://openrouter.ai/api/v1"

[models.backends.google]
model_name = "gemini-2.0-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"

[models.backends.anthropic]
model_name = "claude-haiku-4-5-20251001"

[models.backends.openai]
model_name = "gpt-4o-mini"
